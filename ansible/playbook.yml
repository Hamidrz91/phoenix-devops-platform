---
- name: Configure Phoenix server
  hosts: phoenix
  gather_facts: true

  tasks:
    - name: Confirm Ansible is managing Phoenix
      ansible.builtin.debug:
        msg: "Phoenix is being managed by Ansible."

    - name: Gather service information
      ansible.builtin.service_facts:

    - name: Show Docker service status
      ansible.builtin.debug:
        msg: "Docker service state: {{ ansible_facts.services['docker.service'].state }}"

    - name: Ensure Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      become: true

    - name: Create Phoenix environment file
      ansible.builtin.template:
        src: templates/phoenix.env.j2
        dest: "{{ playbook_dir }}/../.env"
        mode: "0600"
      no_log: true

    - name: Ensure Tempo data volume exists
      community.docker.docker_volume:
        name: phoenix_tempo_data
        state: present
      register: tempo_volume

    - name: Set Tempo data volume ownership
      ansible.builtin.file:
        path: "{{ tempo_volume.volume.Mountpoint }}"
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0755"
        recurse: true
      become: true

    - name: Deploy Phoenix with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ playbook_dir }}/.."
        state: present
        pull: always
